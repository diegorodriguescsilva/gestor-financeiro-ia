name: Gerar Executável Windows e Release

on:
  push:
    tags:
      - 'v*' # Roda automaticamente quando você criar uma tag (ex: v1.2.1, v1.2.2)

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-sqlalchemy google-genai python-dotenv pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed `
        --add-data "templates;templates" `
        --add-data "static;static" `
        --name "GestorFinanceiroIA" `
        app.py

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/GestorFinanceiroIA.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}